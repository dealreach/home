<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealReach India | Best Deals & Discounts</title>
    <link rel="icon" type="image/x-icon" href="dealreach.ico" />
    
    <!-- Modern Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #121212;
            --fb-blue: #1877F2;
            --wa-green: #25D366;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        /* Anti-copy measures you requested */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: var(--glass-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .logo-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05);
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            color: #222;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: #b38b1d; /* Gold tint to match logo */
        }

        .description {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn i {
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .facebook-btn {
            background-color: var(--fb-blue);
            color: white;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3);
        }

        .facebook-btn:hover {
            background-color: #145dbf;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.4);
        }

        .whatsapp-btn {
            background-color: var(--wa-green);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background-color: #1ebc5a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 0.8s ease-out;
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

    <div class="container">
        <div class="logo-wrapper">
            <!-- Replace dr2.jpeg with your logo filename -->
            <img src="dr2.jpeg" alt="DealReach India" class="profile-image">
        </div>

        <h1>Welcome to <span>DealReach.in</span></h1>
        
        <p class="description">
            Helping you discover the latest deals, discounts, and shopping savings from trusted sellers across India.
        </p>

        <div class="btn-stack">
            <button class="btn facebook-btn" onclick="openFacebookApp()">
                <i class="fab fa-facebook"></i> Follow us on Facebook
            </button>

            <button class="btn whatsapp-btn" onclick="openWhatsApp()">
                <i class="fab fa-whatsapp"></i> Join WhatsApp Channel
            </button>
        </div>

        <footer>
            <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> DealReach.in<br>All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // Block Ctrl+U (View Source)
        document.onkeydown = function(e) {
            if (e.ctrlKey && (e.keyCode === 85)) {
                return false;
            }
        };

        function openFacebookApp() {
            const pageId = "400414339828285"; 
            const fallbackUrl = "https://www.facebook.com/DealReachIndia/";
            
            // Try opening in App
            window.location = "fb://page/" + pageId;
            
            // Fallback to browser
            setTimeout(() => {
                window.location.href = fallbackUrl;
            }, 500);
        }

        function openWhatsApp() {
            // This opens your specific channel link directly
            window.location.href = "https://whatsapp.com/channel/0029VbCNFrb1dAw6qgFIqF23";
        }
    </script>
</body>
</html>
